<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Khu Vườn Thú Cưng</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/pet-panel.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/battle.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="chip">🪙 <span id="h-coins">200</span></div>
    <div class="chip">⭐ Lv.<span id="h-lv">1</span></div>
    <button class="chip" id="btn-deco" style="margin-left:auto;cursor:pointer;font-family:inherit">🧰 Chức năng</button>
  </div>
  <div id="deco" class="hidden">
    <div class="m-tabs" id="m-tabs">
      <button data-m="deco" class="on">🎨 Trang trí</button>
      <button data-m="pets">🐾 Danh sách pet</button>
      <button data-m="maps">🗺️ Map</button>
      <button id="d-done">✔ Đóng</button>
    </div>
    <div class="d-tabs" id="d-sub">
      <button data-t="path" class="on">🛤️ Làm đường</button>
      <button data-t="item">🪴 Đặt vật phẩm</button>
      <button data-t="move">✋ Chỉnh sửa</button>
    </div>
    <div class="d-body" id="d-body"></div>
  </div>
  <input type="file" id="f-files" accept="image/*" multiple hidden>
  <input type="file" id="f-dir" accept="image/*" multiple webkitdirectory hidden>
  <div id="pet-panel" class="hidden">
    <button id="pp-close" onclick="closePetPanel()">✕</button>
    <img id="pp-img" src="">
    <div id="pp-name">—</div>
    <div class="sbar">🍖 <div class="sbar-bg"><div class="sbar-fill" id="b-hun" style="background:#f59e0b;width:100%"></div></div></div>
    <div class="sbar">❤️ <div class="sbar-bg"><div class="sbar-fill" id="b-hap" style="background:#ec4899;width:100%"></div></div></div>
    <div class="sbar">⚡ <div class="sbar-bg"><div class="sbar-fill" id="b-ene" style="background:#38bdf8;width:100%"></div></div></div>
    <button class="pp-btn" onclick="dofeed()">🍖 Cho ăn (10🪙)</button>
    <button class="pp-btn" onclick="doplay()">🎾 Chơi đùa</button>
    <button class="pp-btn" onclick="dosleep()">💤 Ngủ</button>
    <button class="pp-btn" onclick="dostash()">🏠 Cất vào danh sách</button>
  </div>
  <div id="toast"></div>
</div>
<script src="js/config/world.js"></script>
<script src="js/config/pets.js"></script>
<script src="js/config/decor.js"></script>
<script src="js/config/battle.js"></script>
<script src="js/core/canvas.js"></script>
<script src="js/data/game-save.js"></script>
<script src="js/assets/images.js"></script>
<script src="js/assets/sprites.js"></script>
<script src="js/assets/pet-loader.js"></script>
<script src="js/assets/boot.js"></script>
<script src="js/pets/world.js"></script>
<script src="js/pets/movement.js"></script>
<script src="js/pets/skills.js"></script>
<script src="js/input/keyboard.js"></script>
<script src="js/input/pointer.js"></script>
<script src="js/render/pet-draw.js"></script>
<script src="js/render/fx-draw.js"></script>
<script src="js/render/scene.js"></script>
<script src="js/ui/pet-panel.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/maps/maps.js"></script>
<script src="js/decor/core.js"></script>
<script src="js/decor/paths.js"></script>
<script src="js/decor/items.js"></script>
<script src="js/decor/edit.js"></script>
<script src="js/decor/ui.js"></script>
<script src="js/decor/import.js"></script>
<script src="js/menu/menu.js"></script>
<script src="js/menu/body.js"></script>
<script src="js/menu/pet-drag.js"></script>
<script src="js/data/decor-save.js"></script>
<script src="js/battle/state.js"></script>
<script src="js/battle/ui.js"></script>
<script src="js/battle/prep.js"></script>
<script src="js/battle/enemies.js"></script>
<script src="js/battle/draw.js"></script>
<script src="js/battle/flow.js"></script>
<script src="js/mobile/layout.js"></script>
<script src="js/mobile/controls.js"></script>
<script src="js/main.js"></script>
</body>
</html>
